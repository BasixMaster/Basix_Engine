<g font-family="Segoe UI,Arial,sans-serif" fill="#163246"><text x="32" y="40" font-size="23" font-weight="700">A small API foundation, explicit renderer ownership</text>
<g stroke-width="1.5"><rect x="32" y="70" width="314" height="226" rx="12" fill="#e4f2eb" stroke="#528c70"/><rect x="383" y="70" width="314" height="226" rx="12" fill="#e5eef9" stroke="#547fba"/><rect x="734" y="70" width="314" height="226" rx="12" fill="#f1ebf9" stroke="#8c72ac"/></g>
<g font-size="21" font-weight="700"><text x="53" y="108">NoGraphicsAPI</text><text x="404" y="108">Basix native Vulkan</text><text x="755" y="108">Basix rendering</text></g>
<g font-size="18"><text x="53" y="144">Device / GPU heaps</text><text x="53" y="177">Textures / descriptors</text><text x="53" y="210">Commands / timelines</text><text x="53" y="243">Submission / data movement</text><text x="404" y="144">BLAS / TLAS / scratch</text><text x="404" y="177">Pipelines / RT dispatch</text><text x="404" y="210">Native images / SDK tags</text><text x="404" y="243">State restoration / lifetime</text><text x="755" y="144">Materials / path transport</text><text x="755" y="177">Depth / motion / jitter</text><text x="755" y="210">Scene / history semantics</text><text x="755" y="243">Reconstruction integration</text></g>
