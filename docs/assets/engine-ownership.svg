<rect x="32" y="320" width="1016" height="52" rx="10" fill="#163246"/><text x="540" y="353" text-anchor="middle" fill="#fff" font-size="19">One device · explicit synchronization · shared scene/material semantics</text><text x="540" y="395" text-anchor="middle" font-size="15" fill="#536878">Conceptual ownership. Equal box widths do not represent code or effort percentages.</text></g></svg>
