<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="t d">
<title id="t">Basix engine ownership and shared contracts</title><desc id="d">NoGraphicsAPI is the GPU foundation. A Basix native Vulkan adapter supplies RT and SDK interoperability. Original Basix systems implement rendering. All share one device and explicit lifetime contracts.</desc>
